# quem julga não se muda.
#
# `mutable` é o que uma proposta pode tocar — o genoma 360° do harness.
# `immutable` é a blocklist: régua, gate, exames e histórico. A blocklist
# SEMPRE vence: um path que casa nas duas listas é contradição de
# configuração, não ambiguidade — `load_genome()` recusa carregar.
#
# Matching é por fnmatch sobre o path relativo à raiz do repo (posix).

mutable = [
    "agent.py",
    "prompts/**",
    "profile.py",
    # que tools cada kind de run recebe; o teto (safety.ALLOWED_TOOLS_MAX) é
    # imutável, então mexer aqui só escolhe subconjunto — não amplia poder.
    "evolution/tools.toml",
]

immutable = [
    "evolve.py",
    "score.py",
    "safety.py",
    "kpi.py",
    "evolution/genome.toml",
    # quem PROPÕE também não se muda: o loop e o catálogo que decide o que
    # propor ficam fora do alcance das propostas que eles mesmos geram (D6).
    "autopilot.py",
    "mockagent.py",
    # quem ESCOLHE o modelo também não se muda: uma proposta que reescreve o
    # router pode se dar o tier caro e falsear o próprio A/B (D7).
    "router.py",
    "evolution/models.toml",
    # quem MONTA o plano da run (e valida as tools contra o teto) também não se
    # muda: uma proposta que reescreve runplan.py contorna ALLOWED_TOOLS_MAX.
    "runplan.py",
    # quem MEDE a qualidade não se muda: nota humana fora do alcance do genoma.
    "note.py",
    "projects/**/notes.tsv",
    "evolution/catalog.toml",
    "benchmarks/sealed/**",
    "benchmarks/held_in/**",
    "tests/**",
    "results.tsv",
    ".harness/**",
]
