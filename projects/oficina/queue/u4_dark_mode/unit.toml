# Painel da Oficina — unidade autorada à mão; verify_cmd escrito ANTES do run.
# Tema real: 2 definicoes de --bg, var() consumido, botao em toda pagina, localStorage.
id = "u4_dark_mode"
kind = "code"
project = "oficina"
prompt = "Leia prompt.md no diretório de trabalho e cumpra o que está lá à risca. Trabalhe no diretório de trabalho atual (é o repo do site); todos os arquivos do site ficam em dist/."
verify_cmd = '''
python3 - <<'PY'
import glob, re
paths = sorted(glob.glob('dist/*.html') + glob.glob('dist/*.js') + glob.glob('dist/*.css'))
blob = '\n'.join(open(p, encoding='utf-8').read() for p in paths)
css = open('dist/style.css', encoding='utf-8').read()
assert 'localStorage' in blob, 'tema nao persiste: nenhum localStorage nos arquivos de dist/'
assert '--bg' in css and '--fg' in css, 'style.css sem as variaveis --bg e --fg'
assert 'var(--bg)' in css and 'var(--fg)' in css, 'style.css nao consome var(--bg)/var(--fg)'
assert 'data-theme' in blob or 'prefers-color-scheme' in blob, \
    'sem seletor de tema: nem data-theme nem prefers-color-scheme'
defs = len(re.findall(r'--bg\s*:', css))
assert defs >= 2, f'--bg definido {defs}x em style.css; precisa dos DOIS temas (claro e escuro)'
assert re.search(r'id=["\']tema["\']', blob), 'sem o botao id="tema"'
js = open('dist/app.js', encoding='utf-8').read()
assert 'tema' in js and 'localStorage' in js, 'app.js nao trata o toggle de tema com localStorage'
assert re.search(r'setAttribute|dataset', js), 'app.js nao aplica o tema no documento'
htmls = [p for p in glob.glob('dist/*.html')]
faltando = [p for p in htmls if not re.search(r'id=["\']tema["\']', open(p, encoding='utf-8').read())]
assert not faltando, f'paginas sem o botao de tema: {faltando}'
print('u4 ok:', len(htmls), 'paginas com toggle')
PY
'''
