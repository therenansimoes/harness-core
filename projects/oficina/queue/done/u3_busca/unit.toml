id = "u3_busca"
kind = "code"
project = "oficina"
prompt = "Leia prompt.md no diretório de trabalho e cumpra o que está lá à risca. Trabalhe no diretório de trabalho atual (é o repo do site); todos os arquivos do site ficam em dist/."
verify_cmd = '''
set -e
grep -q 'id="busca"' dist/inventario.html
grep -q 'addEventListener' dist/app.js
python3 - <<'PY'
import re
js = open('dist/app.js', encoding='utf-8').read()
h = open('dist/inventario.html', encoding='utf-8').read()
assert 'busca' in js, 'app.js nao referencia o id "busca"'
assert re.search(r'getElementById|querySelector', js), 'app.js nao seleciona nada no DOM'
assert 'toLowerCase' in js, 'filtro nao e case-insensitive (falta toLowerCase)'
assert 'style.display' in js or 'classList' in js, \
    'app.js nao esconde/mostra linhas (falta style.display ou classList)'
assert re.search(r'tbody|<tr|querySelectorAll', js), 'app.js nao percorre as linhas da tabela'
assert re.search(r'src\s*=\s*["\']app\.js["\']', h), 'inventario.html nao carrega app.js'
assert re.search(r'<input\b[^>]*id=["\']busca["\']', h, re.I), 'sem <input id="busca">'
print('u3 ok')
PY
'''
