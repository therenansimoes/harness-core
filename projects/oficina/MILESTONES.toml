# Marcos do site da oficina: agrupamento declarado das unidades da fila.
# Puro dado — `harness status` lê e mostra progresso; nada aqui muda execução.
# Unidade conta como feita quando o diretório dela está em `queue/done/`
# (match por nome). Arquivo opcional: apagar volta o status ao formato antigo.
#
# [[milestone]]
# name = "..."
# units = ["<basename do dir da unidade>", ...]

[[milestone]]
name = "MVP navegável"
units = ["u1_esqueleto", "u2_inventario", "u3_busca"]

[[milestone]]
name = "Tema escuro"
units = ["u4a_botao_tema", "u4b_css_vars", "u4c_persistencia"]

[[milestone]]
name = "Completo"
units = ["u5_grafico_svg", "u6_sobre_e_validacao"]
