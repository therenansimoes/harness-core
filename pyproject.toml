[project]
name = "harness-core"
version = "0.5.0"
description = "Provider-agnostic agent harness: backends, ledger and ruler over LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renan Simões", email = "renan@rogerstenis.com.br" }]
# Pins exatos: a topologia depende do checkpointer, e o risco 1 da spec manda
# travar versão no lock (uv.lock é immutable no genoma).
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[dependency-groups]
# Grupo (não extra) para o `uv run pytest` funcionar num sync limpo. O `ruff`
# entra aqui porque `run_lint` (harness/backends/flow_tools.py) precisa de um
# linter resolvível sem instalar nada no workspace do run.
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.optional-dependencies]
# Extra opcional do EXECUTOR: o núcleo não depende de LangChain (langgraph do
# core cobre grafo+checkpointer). Pins exatos — a API do deepagents é jovem
# (risco 1 da SPEC), então nada de faixa de versão aqui.
deepagents = [
    "deepagents==0.7.1",
    "langchain==1.3.14",
    "langchain-openai>=1.4.1",
]

[project.scripts]
harness = "harness.cli:main"

[project.entry-points."harness.backends"]
mock = "harness.backends.mock:MockBackend"
deepagents = "harness.backends.deepagents_backend:DeepagentsBackend"
claude_code = "harness.backends.claude_code:ClaudeCodeBackend"

# Slot de auth: só o adapter nulo. Adapter de OAuth de assinatura em cliente de
# terceiro é área cinzenta de ToS e não entra neste repo (risco 7 da SPEC).
[project.entry-points."harness.auth"]
null = "harness.backends.auth.base:NullAuth"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
# Mesma largura do código existente do repo (docstrings e tabelas de regex
# passam de 88 e quebrá-las piora a leitura).
line-length = 100

[tool.ruff.lint]
# Ruleset CURADO, não o default amplo: cada família aqui pega bug de verdade
# (F/E9), sujeira que apodrece (F401/I001) ou idioma morto (UP). O default do
# ruff é E4/E7/E9/F; o que somamos é B (bugbear), SIM (simplify), I (isort),
# UP (pyupgrade) e RUF.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Comentário, docstring e mensagem de erro são em português: "—", "ç", "ã" e
    # afins não são homoglifo suspeito aqui, são o idioma do repo.
    "RUF001",
    "RUF002",
    "RUF003",
    # `try/except/pass` é o fail-open documentado abaixo, e quase sempre carrega
    # um comentário explicando POR QUE engolir é o certo naquele ponto.
    # `contextlib.suppress` esconde esse comentário.
    "SIM105",
]
# O que ficou DE FORA de propósito, porque brigaria com convenção deliberada
# deste repo — não é descuido:
#
#   BLE001 (blind-except) — `except Exception` é o padrão fail-open do harness:
#     um passo que quebra degrada o ciclo, nunca derruba o loop. Ver
#     harness/autopilot.py e harness/backends/*.
#   S110 / S112 (try-except-pass / -continue) — mesma razão: o corpo vazio É a
#     decisão (best-effort em telemetria, cleanup, probe de ambiente).
#   PLW1510 (subprocess-run-without-check) — o harness inspeciona returncode e
#     stderr por conta própria; `check=True` trocaria diagnóstico por traceback.
#   EXE001 — scripts de `scripts/` têm shebang e não precisam do bit +x no git.
#
# Se alguma dessas voltar ao select, ~170 achados legítimos por convenção
# aparecem de uma vez. Discutir antes, não só habilitar.

[tool.ruff.lint.per-file-ignores]
# Testes: `assert False` como "não devia chegar aqui", `pytest.raises(Exception)`
# em probe de erro e default mutável em dublê de classe são vocabulário normal de
# suíte — não valem reescrita.
"tests/*" = ["B011", "B017", "RUF012"]
"legacy/tests/*" = ["B011", "B017", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", "projects", "benchmarks", "data"]
addopts = "-m 'not lmstudio and not claude_cli and not slow'"
markers = [
    "lmstudio: exige o servidor do LM Studio no ar (MLX, porta 1234; excluído por padrão)",
    "claude_cli: gasta dinheiro — exige o Claude Code CLI instalado e autenticado (excluído por padrão)",
    "slow: baixa pacote de verdade e leva minutos (install_deps; excluído por padrão)",
]
