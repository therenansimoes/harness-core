[project]
name = "harness-core"
version = "0.5.0"
description = "Provider-agnostic agent harness: backends, ledger and ruler over LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renan Simões", email = "renan@rogerstenis.com.br" }]
# Pins exatos: a topologia depende do checkpointer, e o risco 1 da spec manda
# travar versão no lock (uv.lock é immutable no genoma).
dependencies = [
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Mesmo conteúdo do extra `dev`, como grupo PEP 735: o grupo é sincronizado por
# default, então `uv run pytest -q` (o aceite de todo PR) funciona em checkout
# limpo, sem depender de um pytest de fora do lock.
[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[project.entry-points."harness.backends"]
mock = "harness.backends.mock:MockBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", "projects", "benchmarks", "data"]
