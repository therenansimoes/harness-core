[project]
name = "harness-core"
version = "0.5.0"
description = "Provider-agnostic agent harness: backends, ledger and ruler over LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Renan Simões", email = "renan@rogerstenis.com.br" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness = "harness.cli:main"

[project.entry-points."harness.backends"]
mock = "harness.backends.mock:MockBackend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", "projects", "benchmarks", "data"]
