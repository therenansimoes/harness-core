# Knobs operacionais do juiz (harness/ruler/gate.py).
#
# Este arquivo é MUTÁVEL — mas mutação aqui só é aceita via meta-exame
# (harness/improve/meta.py: exame selado + ack humano). O autopilot sozinho
# nunca aplica mudança neste arquivo.
#
# Ausente ou malformado => valem os defaults congelados no código, que são
# exatamente os valores abaixo (comportamento idêntico ao de hoje).

[gate]
# Tolerância ABSOLUTA de piora de KPI antes de reverter. 0.0 = estrito
# (default atual): qualquer piora é regressão. KPI que vira NaN ou some no
# "after" NUNCA é tolerado, independente do valor aqui.
kpi_regression_tolerance = 0.0

[pareto]
# Segundo filtro do A/B (harness/ruler/pareto.py): KEEP de Wilson que piorou
# custo ou tempo além da tolerância vira INCONCLUSIVE. Os valores abaixo são os
# defaults congelados no código — `enabled = false` é o comportamento de hoje,
# só Wilson, idêntico ao histórico.
enabled = false
# Piora RELATIVA da média POR RUN tolerada em cada eixo (0.10 = 10%).
cost_tolerance_pct = 0.10
sec_tolerance_pct = 0.10

[exam]
# Quem EXECUTA o exame selado (harness/improve/exam.py). Fica aqui de propósito:
# este arquivo passa pelo meta-exame, então o loop não troca o executor da
# própria prova sem exame selado + ack humano.
#
# "mock" (default) = smoke de $0: só prova que o grafo roda ponta a ponta, e
# unidades com `requires_real_backend = true` no unit.toml ficam de fora.
# Para exame de verdade, aponte para um backend real, ex.:
#   backend = "deepagents"
#   model = "openai:qwen3.5-9b-mlx"   # LM Studio local, $0 por run (config/models.toml)
backend = "mock"
model = ""

# [frontier]
# Quem EXECUTA o screening da quarentena (harness/improve/coevolve.py): o
# candidato só entra na fronteira se ESTE executor falha nele. Seção ausente =>
# vale o `[exam]` acima (e, sem ele, mock).
#
# Screening mock não discrimina dificuldade: o mock falha em quase tudo, então a
# fronteira satura e `harness seal` deixa passar exame que o backend real já
# resolve. Para currículo de verdade, aponte para o mesmo executor da prova:
#   backend = "deepagents"
#   model = "openai:qwen3.5-9b-mlx"
# `max_units`/`deadline_s` são tetos do screening (0 / 0.0 = sem teto): backend
# real custa tempo e dinheiro por candidato.
# max_units = 0
# deadline_s = 0.0
