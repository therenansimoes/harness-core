# Política do run_graph — o que o loop pode calibrar sem tocar a topologia.
# A topologia (harness/graph/**) é imutável no genoma; este arquivo é a parte
# mutável do comportamento. Ausente ou torto => defaults de run_graph.GraphPolicy.

# Backend do checkpointer do grafo. "sqlite" persiste em <data_dir>/checkpoints.sqlite
# e retoma entre processos; "memory" é efêmero (testes/execução descartável — kill -9
# perde o thread). Valor desconhecido => erro na partida (fail-closed: aqui config
# torta não degrada em silêncio, o resume depende deste backend).
checkpointer = "sqlite"

max_attempts = 2        # teto de tentativas por run (retry vira escalate ao bater)
verify_timeout_s = 120.0
# Espera do retry quando o agente declarou `external_wait` em declare_blocker.
# Teto duro de 60s no nó: o defer roda dentro do grafo, não em timer.
blocker_defer_s = 30

[nodes]
# false => o nó degrada para o stub antigo (sem KPI / sem prova de tamper).
measure = true
tamper = true
# ui_verify: a régua olha a tela quando o run produz dist/ (fail-open sem
# Chrome/dist — não derruba runs que não constroem UI). Auditoria 2026-08-03:
# site buildava verde renderizando cru porque isto estava desligado.
ui_verify = true
# delta_gate: com `[checks]` na unidade (régua graduada), retry só continua
# enquanto a nota SOBE. Duas tentativas seguidas sem ganho => escalate_human
# (`sem_gradiente_de_score`), com os dois scores no evento do gate. Ligado por
# default: turno gasto batendo na mesma parede é turno perdido. `false` volta ao
# retry cego. Unidade sem `[checks]` ignora isto — score é 1.0 fixo lá.
delta_gate = true
