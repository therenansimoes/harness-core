# Este arquivo é o CHEFE: prazo, pressão e foco do loop de melhoria.
# Mutação AQUI passa pelo mesmo meta-exame do juiz (improve/meta.py):
# exame selado + ack humano — o loop não afrouxa o próprio prazo.
# Campo torto degrada para o default congelado em harness/governor/governor.py.

[deadline]
run_s = 900.0      # teto wall-clock de um run; estourou -> escalate, não retry
cycle_s = 3600.0   # teto de um ciclo do loop de melhoria

[pressure]
cost_cap_usd = 5.0   # teto de gasto por run
turn_taper = 0.75    # max_turns * taper^attempt: resultado não vem, corda encurta

[focus]
explore_frac_start = 0.5   # fração de exploração no início do ciclo
explore_frac_end = 0.0     # perto do prazo só explota
bench_after = 3            # propostas recentes sem KEEP -> ação vai pro banco
bench_cycles = 2           # ciclos no banco antes de a ação voltar

# Topologia do run, não modelo: quando o mesmo erro volta, o desenho é que está
# errado. Duas regras mexem no roteamento (tier e freio de escalada); reviewer e
# fleet mexem na FROTA de papéis do executor — ver harness/governor/reorg.py.
[reorg]
enabled = true          # false = nenhuma regra decide nada (nem grava)
repeat_failures = 2     # mesma classe de falha N vezes -> sobe um tier
area_ratio = 0.5        # fração dos runs numa área que pede revisor
area_min_n = 4          # amostra mínima antes de a área acusar (ratio no vazio mente)
cost_value_ratio = 1.0  # gasto > valor * ratio -> frota encolhe
trivial_max_chars = 280 # prompt até este tamanho é candidato a trivial
trivial_kinds = ["config", "content"]  # ...e só nestes kinds: trivial não é curto, é raso
reviewer_role = "reviewer"  # papel exigido da frota quando uma área concentra falha
default_value_usd = 0.0     # valor de kind fora da tabela abaixo; 0 = desconhecido

# Quanto vale entregar uma tarefa de cada kind, em USD. DORMENTE de propósito:
# sem tabela e sem `value_usd` na unit, todo valor é 0 e `collapse_fleet` nunca
# dispara. Descomentar é declarar preço — e preço errado encolhe frota à toa.
# [reorg.task_value_usd]
# config = 2.0
# content = 5.0
# code = 25.0
# refactor = 40.0

# Freios do reorg: orçamento por run, parada atada ao verify e trava de
# oscilação. Estourar orçamento PARA A ESCALADA (sem subir tier, sem revisor;
# colapso continua valendo) — nunca mata o run no meio do nó. Campo torto
# degrada para o default congelado em harness/governor/guards.py; 0 desliga o
# teto individual.
[guards]
enabled = true
max_cost_usd = 3.0      # gasto acumulado do run >= isto -> sem mais escalada
max_attempts = 4        # tentativa (0-based) >= isto -> sem mais escalada
max_wall_s = 600.0      # relógio desde o plan >= isto -> sem mais escalada
verify_fail_stop = 3    # N verifies vermelhos seguidos no tier de cima -> parar de tentar
flipflop_window = 6     # K últimas linhas de reorg examinadas pela trava de oscilação
