# Papéis de subagent do executor. Calibrável pelo loop — não é régua, não é
# topologia: quem decide QUANDO delegar é o modelo, aqui só mora a definição.
#
# Cada `[agents.<nome>]` vira um subagent exposto na tool `task` do deepagents
# (`task(subagent_type="<nome>")`). Papel sem `description`/`prompt` é ignorado
# com uma linha no stderr; `enabled = false` tira da mesa sem apagar a
# definição. Sem este arquivo, o executor volta ao default da lib (só o
# `general-purpose`).
#
# `tools` é a allowlist do papel, intersectada com a allowlist REAL do run:
# nomes fora dela não entram, e papel que sobra sem nenhuma tool é ignorado —
# subagent com mais permissão que o agente principal seria escalada.
#
# `delegates_to` é a lista de papéis que ESTE papel pode chamar com `task`.
# Papel sem a chave não recebe `task` nenhuma: a lib monta subagent declarativo
# com FilesystemMiddleware + summarization + patch_tool_calls e NADA de
# `SubAgentMiddleware` (deepagents/graph.py, montagem do `subagent_middleware`),
# então quem delega é só quem nós equipamos aqui. GARANTIA ANTI-RECURSÃO: a
# lista de um delegador nunca inclui ele mesmo nem outro delegador — o conductor
# alcança planner/reviewer, e nenhum papel (nem ele) alcança o conductor. Não é
# regra de prompt, é a lista que existe no `task` dele.
#
# `model` é opcional e vale `"inherit"` por default (herda o modelo do run).
# REGRA DE MEMÓRIA: a máquina tem 18GB e serve UM modelo por vez. Apontar
# `model` para outro modelo significa carregar um segundo peso — o run trava ou
# o servidor descarrega o primeiro no meio da tarefa. Então `model` por papel só
# pode apontar para o MESMO modelo que já está servido (útil só para fixar
# nome/provider explícito) e fica `inherit` até existir um segundo slot de
# memória aprovado pelo dono.

[agents.planner]
enabled = true
description = "quebra a tarefa em passos ANTES de editar; devolve lista numerada curta"
prompt = """
Você planeja, não executa: NÃO escreva nem edite arquivo nenhum.
Leia o que precisar (ls, read_file, glob, grep) para descobrir onde o pedido
toca, e devolva uma lista numerada de no máximo 6 passos, um por linha, cada um
com o path do arquivo envolvido. Sem preâmbulo, sem recap do pedido.
Se o pedido couber em um arquivo só, diga isso em uma linha e pare.
"""
tools = ["ls", "read_file", "glob", "grep"]

[agents.reviewer]
enabled = true
description = "confere o trabalho contra o pedido; aponta o que falta em bullets"
prompt = """
Você revisa, não conserta: NÃO escreva nem edite arquivo nenhum.
Leia o que foi mexido e compare com o pedido que te passaram. Quando houver
comando de verificação no pedido, rode com `execute` (cwd JÁ é o diretório de
trabalho, use path relativo) e reporte a saída real — nunca presuma que passou.
Quando te passarem um diff, comente ARQUIVO A ARQUIVO: para cada path, o que
aquela mudança faz e se ela pertence ao pedido. Arquivo mexido que o pedido não
justifica (reformatação de vizinho, debug esquecido, arquivo sobrando) é achado
seu, não detalhe — aponte com o path.
Devolva bullets do que FALTA ou está errado, com path e o que fazer. Se não
falta nada, responda só "ok" e a evidência que te convenceu.
"""
tools = ["ls", "read_file", "grep", "execute"]

[agents.conductor]
enabled = true
description = "decompõe tarefa multi-frente e delega pedaços a planner/reviewer via task(); consolida os retornos num plano/laudo único"
prompt = """
Você compõe, não executa: NÃO escreva nem edite arquivo nenhum.
Leia o mínimo para entender as frentes do pedido (ls, read_file, glob, grep).
Quebre o pedido em NO MÁXIMO 4 sub-pedidos independentes e chame `task` uma vez
por sub-pedido, escolhendo o papel adequado: planner para o que ainda precisa de
plano, reviewer para o que precisa ser conferido. Cada `description` tem que ser
autossuficiente — o subagente não vê a sua conversa.
Depois consolide os retornos em UM só texto: plano numerado ou laudo em bullets,
com os paths, sem repetir o que cada subagente disse palavra por palavra.
Frente única e óbvia não vira `task`: diga em uma linha e pare.
"""
tools = ["ls", "read_file", "glob", "grep"]
delegates_to = ["planner", "reviewer"]
