# models.toml — classes de CUSTO, knobs do router e tabela de preço. Config,
# não código. Dois consumidores independentes e desacoplados: o router lê
# [[tier]]/[router], o backend lê [pricing]. Cada um ignora o que não é seu.
#
# `tier` é preço, não competência. Quem diz o QUE a unidade é são os kinds
# (config/kinds.toml), e os dois são ortogonais de propósito: é isso que deixa
# o prior aprender "t0 é ruim pro kind code" sem condenar t0 inteiro.
#
# cost_rank: único e contíguo a partir de 0 (0 = mais barato). É a ordem que a
# escalation percorre. Load falha se furar — router que cai em default
# silencioso quando o TOML quebra esconde o bug e paga a conta.
#
# Quem converte token em $ é o backend, via [pricing] no fim do arquivo — o
# router nunca lê preço absoluto, só a ordem relativa de cost_rank.

# TETO DE HARDWARE (M3 Pro, 18GB): preferir quant pequeno. bonsai-27b 1bit ~
# 5.16 GB cabe; densidades maiores (fp16/4bit 27B+) travam a máquina.

[[tier]]
name = "t0"
backend = "deepagents"
# Upstream local: mlx_lm.server na porta 1235 (NÃO LM Studio). Id estável
# `bonsai` — sem `/` nem `:` que o Cursor stripa no nome do modelo.
# Pesos: …/prism-ml/Bonsai-27B-mlx-1bit. Override: OPENAI_BASE_URL.
model = "openai:bonsai"
max_turns = 40
cost_rank = 0

[[tier]]
name = "t1"
backend = "claude_code"
model = "haiku"                  # ~$0.02/run medido no aceite do PR-7
max_turns = 24
cost_rank = 1

[[tier]]
name = "t2"
backend = "claude_code"
model = ""                       # placeholder: o CLI escolhe o modelo dele
max_turns = 40
cost_rank = 2

[router]
default_tier = "t0"   # kind sem entrada em [router.kind] cai aqui
max_attempts = 3      # inclui a 1a tentativa
min_n = 6             # amostra mínima pro prior opinar (Wilson não fala no vazio)
prior_floor = 0.50    # Wilson lower < floor => sobe um tier

# Tier INICIAL por kind: hipótese de partida, calibrável. O prior corrige com
# evidência, a escalation corrige com falha.
[router.kind]
content = "t0"
config = "t0"
code = "t1"
infra = "t1"
refactor = "t2"

# Fallback off-grid: primário indisponível (CLI ausente, sem auth, sem rede) não
# bloqueia o run — degrada para o `tier` daqui e segue. É o único lugar que liga
# isso; `offgrid = false` devolve o comportamento antigo (blocked). A degradação
# nunca é silenciosa: uma linha no stderr e o nó `offgrid_fallback` no ledger,
# senão o prior do router aprenderia com um run que não é do tier que ele acha.
[fallback]
offgrid = true
tier = "t0"

# Tabela de preço por modelo, em USD por 1M de tokens. Calibrável pelo loop
# (arquivo mutável no genoma), a régua nunca depende dele.
#
# Chave = a string de modelo que o harness passa pro backend (`init_chat_model`).
# Modelo AUSENTE da tabela vira `cost_usd = None` — melhor sem número que com
# número falso. Local não é exceção: os modelos servidos em loopback estão
# listados abaixo, explicitamente a 0.0 (custo marginal $0).

# Locais em loopback (mlx_lm.server 1235; OPENAI_BASE_URL pode apontar outro).
[pricing."openai:bonsai"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:qwopus3.5-4b-coder-mtp"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:qwopus"]
input_per_mtok = 0.0
output_per_mtok = 0.0

# Aliases legados (ainda referidos em testes/fixtures) — $0 se alguém piná-los.
[pricing."openai:qwen3.5-9b-mlx"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:qwen/qwen3.5-9b"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:mlx-community/Qwen3.5-4B-4bit"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:mlx-community/Llama-3.2-3B-Instruct-4bit"]
input_per_mtok = 0.0
output_per_mtok = 0.0

# Olho do harness (`judge_image`). Bloco AUSENTE = sem visão, e sem visão o
# caminho normal é `unavailable` — nunca nota inventada.
#
# Mesmo endpoint do executor local (mlx :1235). bonsai declara visão no card;
# se o servidor/modelo recusar imagem, judge_image degrada pra unavailable.
[vision]
model = "openai:bonsai"
timeout_s = 240
max_tokens = 3000
