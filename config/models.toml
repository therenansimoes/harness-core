# models.toml — classes de CUSTO, knobs do router e tabela de preço. Config,
# não código. Dois consumidores independentes e desacoplados: o router lê
# [[tier]]/[router], o backend lê [pricing]. Cada um ignora o que não é seu.
#
# `tier` é preço, não competência. Quem diz o QUE a unidade é são os kinds
# (config/kinds.toml), e os dois são ortogonais de propósito: é isso que deixa
# o prior aprender "t0 é ruim pro kind code" sem condenar t0 inteiro.
#
# cost_rank: único e contíguo a partir de 0 (0 = mais barato). É a ordem que a
# escalation percorre. Load falha se furar — router que cai em default
# silencioso quando o TOML quebra esconde o bug e paga a conta.
#
# Quem converte token em $ é o backend, via [pricing] no fim do arquivo — o
# router nunca lê preço absoluto, só a ordem relativa de cost_rank.

# TETO DE HARDWARE (M3 Pro, 18GB RAM): modelo local até ~7-8B. 30B trava a
# máquina inteira — não entra em tier NUNCA nesta máquina.

[[tier]]
name = "t0"
backend = "deepagents"
# LM Studio local (MLX, porta 1234), $0 por run — o ÚNICO runtime local desde
# 2026-08-04. Auditoria 2026-08-03: o 3B anterior falhou todas as unidades do dia
# (não fecha ler+editar+verificar). O teto de turnos acompanha o modelo do t0.
model = "openai:qwen/qwen3.5-9b"
max_turns = 40
cost_rank = 0

[[tier]]
name = "t1"
backend = "claude_code"
model = "haiku"                  # ~$0.02/run medido no aceite do PR-7
max_turns = 24
cost_rank = 1

[[tier]]
name = "t2"
backend = "claude_code"
model = ""                       # placeholder: o CLI escolhe o modelo dele
max_turns = 40
cost_rank = 2

[router]
default_tier = "t0"   # kind sem entrada em [router.kind] cai aqui
max_attempts = 3      # inclui a 1a tentativa
min_n = 6             # amostra mínima pro prior opinar (Wilson não fala no vazio)
prior_floor = 0.50    # Wilson lower < floor => sobe um tier

# Tier INICIAL por kind: hipótese de partida, calibrável. O prior corrige com
# evidência, a escalation corrige com falha.
[router.kind]
content = "t0"
config = "t0"
code = "t1"
infra = "t1"
refactor = "t2"

# Tabela de preço por modelo, em USD por 1M de tokens. Calibrável pelo loop
# (arquivo mutável no genoma), a régua nunca depende dele.
#
# Chave = a string de modelo que o harness passa pro backend (`init_chat_model`).
# Modelo AUSENTE da tabela vira `cost_usd = None` — melhor sem número que com
# número falso. Local não é exceção: os modelos servidos pelo LM Studio estão
# listados abaixo, explicitamente a 0.0 (custo marginal $0 em loopback).

# LM Studio local (MLX, porta 1234) — custo marginal $0.
[pricing."openai:qwen3.5-9b-optiq"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:qwen/qwen3.5-9b"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:bonsai-27b-mlx"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."openai:google/gemma-4-e4b"]
input_per_mtok = 0.0
output_per_mtok = 0.0

# Olho do harness (`judge_image`). Bloco AUSENTE = sem visão, e sem visão o
# caminho normal é `unavailable` — nunca nota inventada.
#
# É o MESMO modelo do executor local: multimodal nativo, já carregado no LM
# Studio, custo marginal $0. Verificado empiricamente (OCR + controle negativo):
# aceita `image_url` com data-URI base64 e responde sobre a imagem. O gemma-4
# local NÃO serve — descarta a imagem em silêncio e responde como se tivesse
# visto, que é o pior modo de falhar. E `prompt_tokens` do LM Studio não conta
# token de imagem, então não dá para usar a contagem como prova de que a imagem
# chegou.
#
# ORÇAMENTO: este modelo pensa SEMPRE e o thinking não desliga (medido contra o
# servidor vivo: `chat_template_kwargs enable_thinking=false`,
# `reasoning_effort=none` e `/no_think` no prompt são aceitos e IGNORADOS pelo LM
# Studio). O `reasoning_content` come o orçamento inteiro antes do `content`: um
# juízo de tela real gastou 1943 tokens só de reasoning, então com max_tokens
# 1600 a resposta voltava com `content` vazio e `finish_reason: length` — juiz
# sumido, não juiz negativo. 3000 fecha com folga (2096 completion medidos) e
# leva ~78s na M3 Pro, por isso o timeout tem que ser MAIOR que isso: em 60s o
# request morria por timeout mesmo com orçamento sobrando.
[vision]
model = "openai:qwen/qwen3.5-9b"
timeout_s = 240
max_tokens = 3000
