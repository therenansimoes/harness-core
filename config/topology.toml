# Topologia do run-graph como dado (zona mutável do genoma).
#
# Contrato (harness/graph/topology.py):
# - `nodes`: nomes da whitelist NODE_IMPLS. Obrigatório conter plan, execute,
#   verify, gate, record — e os alvos do gate (accept, retry, escalate,
#   revert). Impl desconhecida => spec recusada.
# - `edges`: pares [origem, destino]; "START" e "END" são os terminais.
#   Aresta linear saindo de "gate" é recusada: as saídas do gate são
#   condicionais (decisão da régua -> accept/retry/escalate/revert) e vivem
#   no código, não aqui.
# - Qualquer erro (arquivo ausente, toml torto, validação) => build_run_graph
#   cai na topologia embutida, com 1 linha no stderr. O código dos nós é
#   imutável; este arquivo só rearranja a estrutura.
#
# Topologia por kind (harness/graph/by_kind.py), opcional: uma seção
# [kinds.<kind>] pode declarar OUTRA topologia inteira para unidades daquele
# kind, com `nodes` e `edges` PRÓPRIOS. Nunca há merge com o default: a seção
# substitui tudo, e seção parcial (só um dos dois) é recusada. Kind sem seção
# usa a topologia de topo. Como TOML fecha a tabela corrente, os escalares e
# arrays de topo (`nodes`, `edges`) precisam vir ANTES de qualquer
# [kinds.<kind>].
#
# Fora do caminho do retry este default reproduz a topologia embutida. A única
# variação: `reflect` é o CHECKER do retry — entra entre `retry` e `route`, lê o
# cadáver da tentativa reprovada (exit code do verify, files_changed do exec,
# verify_cmd da unidade — o TEXTO do log do verificador selado nunca entra, sob
# pena de vazar gabarito) e deixa um hint literal no estado, que o `execute` da
# tentativa seguinte cola no prompt. Determinístico, $0, fail-open: sem material
# o hint é vazio e a tentativa roda com o prompt cru, como antes. Tirar
# ["retry","reflect"]/["reflect","route"] e voltar ["retry","route"] desliga.

nodes = [
  "plan",
  "reflect",
  "route",
  "provision",
  "execute",
  "verify",
  "measure",
  "gate",
  "accept",
  "retry",
  "escalate",
  "revert",
  "record",
]

edges = [
  ["START", "plan"],
  ["plan", "route"],
  ["route", "provision"],
  ["provision", "execute"],
  ["execute", "verify"],
  ["verify", "measure"],
  ["measure", "gate"],
  ["retry", "reflect"],
  ["reflect", "route"],
  ["accept", "record"],
  ["escalate", "record"],
  ["revert", "record"],
  ["record", "END"],
]
